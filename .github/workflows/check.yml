name: Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.json'
      - 'tsconfig.json'
      - 'next.config.js'
      - 'vitest.config.mts'
      - '.nvmrc'
      - '.github/workflows/check.yml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run test
